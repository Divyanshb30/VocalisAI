[project]
name = "vocalis"
version = "0.1.0"
description = "Real-time voice agent that negotiates airline refunds and rebookings on a passenger's behalf."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Divyansh Bansal", email = "divyanshb30@gmail.com" }]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "loguru>=0.7",
    "numpy>=1.26",
    "pillow>=10.4",
    "zxing-cpp>=2.3",
    "google-genai>=1.0",
    "litellm>=1.60",
    "rank-bm25>=0.2.2",
    "fastembed>=0.5",
    "langgraph>=1.0",
    "fastmcp>=2.10",
    "opik>=1.7",
]

[project.scripts]
vocalis = "vocalis.cli:main"

[project.optional-dependencies]
voice = [
    "pipecat-ai[deepgram,groq,google,silero,local-smart-turn,webrtc,runner,tracing]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/vocalis/core", "src/vocalis/guards", "src/vocalis/rights", "src/vocalis/telephony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
