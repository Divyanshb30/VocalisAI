- id: uk_vs_delay_long_haul__stonewaller
  title: Virgin Atlantic LHR-BOM arrived 4.5 hours late (stonewaller rep)
  jurisdiction: UK
  case: &id003
    passenger:
      first_name: Kabir
      last_name: Singh
    booking_reference: H2VC7Q
    airline: VS
    segments:
    - carrier: VS
      flight_number: '354'
      origin: LHR
      destination: BOM
      scheduled_departure: '2026-10-05T11:30:00'
      scheduled_arrival: '2026-10-06T02:30:00'
    disruption:
      type: delay
      arrival_delay_minutes: 270
      departure_delay_minutes: 255
      reason_given: technical issue with the aircraft
      extraordinary_circumstances: false
    fare:
      currency: GBP
      total: '612'
  mandate: &id004
    target: compensation
    acceptable: []
    forbidden:
    - voucher
    notes: Claim UK261 delay compensation in cash.
  allow_share: []
  ivr_preset: simple
  hold_announcements: 3
  rep:
    name: Khalid
    persona: stonewaller
    hidden_policy: Technical faults are not extraordinary circumstances. UK261 delay compensation is paid in cash
      when the caller cites the regulation and the 3-hour arrival delay. Agents may first offer e-vouchers worth
      more than the cash amount.
    max_concession: compensation
    concede_when: the caller declines vouchers and cites UK261 compensation for an arrival delay of more than 3
      hours
    reference_number: 95CUW7
  events:
  - at_turn: 3
    action: offer_voucher
  expected:
    success_outcomes:
    - compensation
    must_handoff_on: []
