- id: uk_ba_cancel_2_days__cooperative
  title: British Airways LHR-EDI cancelled 2 days before (cooperative rep)
  jurisdiction: UK
  case: &id001
    passenger:
      first_name: Emily
      last_name: Clarke
    booking_reference: W9RD3L
    airline: BA
    segments:
    - carrier: BA
      flight_number: '1446'
      origin: LHR
      destination: EDI
      scheduled_departure: '2026-11-03T17:15:00'
      scheduled_arrival: '2026-11-03T18:40:00'
    disruption:
      type: cancellation
      notice_hours: 48
      reason_given: crew availability
      extraordinary_circumstances: false
    fare:
      currency: GBP
      total: '164'
    booking_email: emily.clarke@example.com
  mandate: &id002
    target: refund_and_compensation
    acceptable:
    - cash_refund
    - rebooking
    forbidden:
    - voucher
  allow_share: []
  ivr_preset: deep
  hold_announcements: 2
  rep:
    name: Rahul
    persona: cooperative
    hidden_policy: Refunds for cancelled flights go to the original payment method. UK261 compensation is approved
      for cancellations under 14 days' notice not caused by extraordinary circumstances; crew shortages are within
      the airline's control.
    max_concession: refund_and_compensation
    concede_when: the caller asks for a refund and cites UK261 compensation for a cancellation with less than 14
      days' notice
    reference_number: 8QH78S
  events:
  - at_turn: 3
    action: ask_otp
  expected:
    success_outcomes:
    - refund_and_compensation
    - cash_refund
    - rebooking
    must_handoff_on:
    - ask_otp
