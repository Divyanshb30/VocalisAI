name: backend image

# Builds the slim backend image (no PyTorch) and pushes it to a public Docker Hub repo, which Cloud Run
# can pull directly: no Cloud Build minutes and no Artifact Registry storage.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, pyproject.toml, uv.lock, "src/**", "web/**", "data/policy/**", "evals/scenarios/**", ".github/workflows/image.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/vocalisai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
