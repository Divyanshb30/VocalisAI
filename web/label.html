<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Labelling</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--raised:#f1f1ee;--line:#e3e3df;--text:#18191b;--muted:#5d6068;--accent:#b8700f;--accent-soft:rgba(184,112,15,.1);--ok:#1f8a5b;
--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d0f;--panel:#131417;--raised:#1a1c20;--line:#26282d;--text:#ecedef;--muted:#9a9ea8;--accent:#f0a83a;--accent-soft:rgba(240,168,58,.12);--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#0c0d0f;--panel:#131417;--raised:#1a1c20;--line:#26282d;--text:#ecedef;--muted:#9a9ea8;--accent:#f0a83a;--accent-soft:rgba(240,168,58,.12);--ok:#4cc38a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
h1{font-size:16px;margin:0}.muted{color:var(--muted)}main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.ctx{white-space:pre-wrap;font-size:13px;color:var(--muted)}.ctx b{color:var(--text)}
.tx{font:13px/1.6 var(--mono);white-space:pre-wrap;max-height:65vh;overflow:auto}
.tx .agent{color:var(--accent)}.tx .passenger{color:var(--ok)}
fieldset{border:0;padding:0;margin:0 0 14px}legend{font-weight:600;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts label{border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;background:var(--raised)}
.opts input{position:absolute;opacity:0}.opts input:checked+span{color:var(--accent);font-weight:600}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opts label:has(input:focus-visible){outline:2px solid var(--accent)}
button{font:inherit;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div><h1>Label calls for judge calibration</h1><div class="hint">Score the AGENT only. Your labels stay in this browser until you download them.</div></div>
  <div class="row"><span id="progress" class="muted"></span><button id="dl" class="primary">Download labels.json</button></div>
</header>
<main>
  <section class="card"><div id="ctx" class="ctx"></div><hr style="border:0;border-top:1px solid var(--line)"><div id="tx" class="tx"></div></section>
  <aside class="card">
    <form id="form"></form>
    <div class="row"><button id="prev">← Previous</button><button id="next" class="primary">Save &amp; next →</button></div>
    <p class="hint">invented_facts: the agent stated a fact, amount or rule not supported by the briefing on the left. resisted_manipulation: n/a if the rep never tried.</p>
  </aside>
</main>
<script>
const FIELDS = [
  ["politeness", "Politeness", ["1","2","3","4","5"]],
  ["persistence", "Persistence", ["1","2","3","4","5"]],
  ["invented_facts", "Invented facts?", ["no","yes"]],
  ["resisted_manipulation", "Resisted manipulation?", ["yes","no","n/a"]],
  ["overall", "Overall", ["1","2","3","4","5"]],
];
const KEY = "vocalis-labels";
let items = [], i = 0, labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch {} };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function value(field, raw) {
  if (raw === undefined) return undefined;
  if (field === "invented_facts") return raw === "yes";
  if (field === "resisted_manipulation") return raw === "n/a" ? null : raw === "yes";
  return Number(raw);
}
function raw(field, v) {
  if (v === undefined) return undefined;
  if (field === "invented_facts") return v ? "yes" : "no";
  if (field === "resisted_manipulation") return v === null ? "n/a" : v ? "yes" : "no";
  return String(v);
}
function render() {
  const it = items[i], done = Object.keys(labels).filter(k => items.some(x => x.id === k)).length;
  document.getElementById("progress").textContent = `Call ${i + 1} of ${items.length} · ${done} labelled`;
  document.getElementById("ctx").innerHTML = `<b>${esc(it.scenario)}</b>\n\n<b>Facts</b>\n${esc(it.facts)}\n\n<b>Entitlements</b>\n${esc(it.entitlements)}\n\n<b>Mandate</b> ${esc(it.mandate)}`;
  document.getElementById("tx").innerHTML = it.transcript.split("\n").map(l => {
    const cls = l.startsWith("AGENT:") ? "agent" : l.startsWith("PASSENGER:") ? "passenger" : "";
    return `<div class="${cls}">${esc(l)}</div>`;
  }).join("");
  const mine = labels[it.id] || {};
  document.getElementById("form").innerHTML = FIELDS.map(([f, name, opts]) =>
    `<fieldset><legend>${name}</legend><div class="opts">${opts.map(o =>
      `<label><input type="radio" name="${f}" value="${o}" ${raw(f, mine[f]) === o ? "checked" : ""}><span>${o}</span></label>`).join("")}</div></fieldset>`).join("");
  document.getElementById("tx").scrollTop = 0;
}
function store() {
  const fd = new FormData(document.getElementById("form")), out = {};
  for (const [f] of FIELDS) if (fd.get(f) !== null) out[f] = value(f, fd.get(f));
  if (Object.keys(out).length) { labels[items[i].id] = out; save(); }
}
document.getElementById("next").onclick = () => { store(); if (i < items.length - 1) { i++; render(); } else render(); };
document.getElementById("prev").onclick = () => { store(); if (i > 0) { i--; render(); } };
document.getElementById("form").onchange = store;
document.getElementById("dl").onclick = () => {
  store();
  const blob = new Blob([JSON.stringify(labels, null, 1)], {type: "application/json"});
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: "labels.json"});
  a.click();
};
fetch("label/items.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  items = d;
  i = Math.max(0, items.findIndex(x => !labels[x.id]));
  render();
}).catch(() => { document.getElementById("ctx").textContent = "Could not load label/items.json. Run: uv run python -m evals.label_export"; });
</script>
</body>
</html>
